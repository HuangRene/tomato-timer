<title>Jelly Tomato</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
  /* Layout: a fake desktop "stage" where the jelly tomato lives, with a slim test panel beside it; stacks on phones */
  :root {
    --bg: #FBF7F6;
    --fg: #2A1714;
    --muted: #7A625D;
    --panel: #FFFFFF;
    --line: #EBDDD8;
    --accent: #E5483B;
    --wall-a: #DCE5FF;
    --wall-b: #FFE2D4;
    --mb-bg: rgba(255, 255, 255, 0.6);
    --mb-fg: #2A1714;
    --focus: #2F6BFF;
    --f-display: "Fredoka", "Noto Sans TC", ui-rounded, system-ui, sans-serif;
    --f-body: "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16100F; --fg: #F6ECE9; --muted: #B59D97; --panel: #211816; --line: #3A2B28;
      --accent: #FF6B5C; --wall-a: #1C2340; --wall-b: #3B1E2A; --mb-bg: rgba(18, 12, 11, 0.55);
      --mb-fg: #F6ECE9; --focus: #7FA6FF; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16100F; --fg: #F6ECE9; --muted: #B59D97; --panel: #211816; --line: #3A2B28;
    --accent: #FF6B5C; --wall-a: #1C2340; --wall-b: #3B1E2A; --mb-bg: rgba(18, 12, 11, 0.55);
    --mb-fg: #F6ECE9; --focus: #7FA6FF; color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--f-body);
    line-height: 1.6;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 28px 40px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }

  header { display: flex; flex-direction: column; gap: 4px; }
  .eyebrow { font-size: 12px; letter-spacing: 0.08em; color: var(--muted); font-weight: 500; }
  h1 {
    font-family: var(--f-display); font-weight: 700; font-size: clamp(30px, 5vw, 44px);
    line-height: 1.1; margin: 0; text-wrap: balance; color: var(--accent);
  }
  header p { margin: 4px 0 0; color: var(--muted); max-width: 60ch; }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: minmax(0, 1fr); } }

  /* Fake desktop */
  .stage {
    position: relative; border-radius: 22px; overflow: hidden;
    background: radial-gradient(120% 90% at 15% 10%, var(--wall-a), transparent 60%),
                radial-gradient(120% 90% at 90% 100%, var(--wall-b), transparent 60%),
                var(--panel);
    border: 1px solid var(--line);
    min-height: 480px; display: flex; flex-direction: column;
  }
  .menubar {
    display: flex; justify-content: flex-end; align-items: center; gap: 18px;
    padding: 6px 16px; font-size: 13px; color: var(--mb-fg);
    background: var(--mb-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    font-variant-numeric: tabular-nums;
  }
  .menubar .mb-tomato { font-weight: 500; min-width: 7.5em; text-align: right; }
  .menubar .mb-dim { opacity: 0.6; }
  .tomato-area { flex: 1; display: grid; place-items: center; padding: 8px 0 0; }
  #svg { width: min(100%, 420px); height: auto; aspect-ratio: 1; max-width: 100%; display: block; overflow: visible; touch-action: manipulation; }
  .hint { text-align: center; color: var(--muted); font-size: 13px; margin: 0 0 16px; }

  /* Test panel */
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
    padding: 18px; display: flex; flex-direction: column; gap: 18px;
  }
  .panel h2 { font-size: 13px; letter-spacing: 0.08em; color: var(--muted); margin: 0; font-weight: 700; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .row label { font-size: 14px; }
  .row small { display: block; color: var(--muted); font-size: 12px; }
  .switch { position: relative; width: 42px; height: 24px; flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .switch span {
    position: absolute; inset: 0; border-radius: 999px; background: var(--line);
    transition: background 0.2s;
  }
  .switch span::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--panel); box-shadow: 0 1px 2px rgba(0,0,0,0.25);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(18px); }
  .switch input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
  .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .pbtn {
    font: 500 13px var(--f-body); color: var(--fg); background: transparent;
    border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s;
  }
  .pbtn:hover { border-color: var(--accent); transform: scale(1.04); }
  .pbtn:active { transform: scale(0.95); }
  .pbtn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .notes { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 13.5px; }
  .notes b { font-weight: 700; }
  .swatches { display: inline-flex; gap: 4px; vertical-align: middle; margin-left: 4px; }
  .swatches i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

  /* --- Tomato SVG --- */
  #svg text { font-family: var(--f-display); user-select: none; -webkit-user-select: none; }
  .t-light { fill: #FFFFFF; font-weight: 700; paint-order: stroke; stroke: rgba(120, 18, 10, 0.35); stroke-width: 4; }
  .t-dark { fill: var(--ink); font-weight: 700; }
  .t-status { fill: var(--ink); font-weight: 600; opacity: 0.8; }

  #svg {
    --skin-a: #FF6A55; --skin-b: #D9261B; --gel: #FF8E78; --gel-sel: #FFB4A3;
    --core-a: #FFE3DA; --core-b: #FFC2B1; --ink: #7A1D14; --calyx: #2F8F3A;
  }
  #svg.rest {
    --skin-a: #6FD173; --skin-b: #2E9A3E; --gel: #A8E99A; --gel-sel: #A8E99A;
    --core-a: #EEFBE6; --core-b: #CDEFC0; --ink: #1F5A28; --calyx: #1E5E27;
  }
  #tomato.done { cursor: pointer; }
  .skin-stop-a { stop-color: var(--skin-a); transition: stop-color 0.6s; }
  .skin-stop-b { stop-color: var(--skin-b); transition: stop-color 0.6s; }
  .core-stop-a { stop-color: var(--core-a); transition: stop-color 0.6s; }
  .core-stop-b { stop-color: var(--core-b); transition: stop-color 0.6s; }
  #calyx { fill: var(--calyx); transition: fill 0.6s; }

  .loc { transform-box: fill-box; transform-origin: center; transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); outline: none; }
  .loc .gel { fill: var(--gel); stroke: var(--gel); stroke-width: 12; stroke-linejoin: round; transition: fill 0.25s, stroke 0.25s; }
  .loc.sel .gel { fill: var(--gel-sel); stroke: var(--gel-sel); }
  .loc .lbl { fill: var(--ink); font-weight: 600; transition: fill 0.25s; }
  .loc .unit { fill: var(--ink); font-weight: 500; opacity: 0.75; }
  .loc.sel .lbl { font-weight: 700; }
  .loc .dot { fill: var(--ink); }
  .seed-in { transform-box: fill-box; transform-origin: center; }
  .seed-in ellipse { fill: #F8E7A8; stroke: #E0B65A; stroke-width: 0.8; }
  .seed-in circle { fill: rgba(255, 255, 255, 0.25); }

  .interactive .loc { cursor: pointer; }
  .interactive .loc:hover, .interactive .loc:focus-visible { transform: scale(1.07); }
  .interactive .loc:hover .gel, .interactive .loc:focus-visible .gel { fill: var(--hov); stroke: var(--hov); }
  .interactive .loc:hover .lbl { fill: #FFFFFF; }
  .interactive .loc:hover .unit { fill: #FFFFFF; }
  .interactive .loc:active { transform: scale(0.94); transition-duration: 0.12s; }
  .interactive .loc:hover .seed-in { animation: wiggle 0.5s ease-in-out infinite alternate; }
  .interactive .loc:focus-visible .gel { stroke-width: 15; }
  @keyframes wiggle { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }

  .cbtn { cursor: pointer; outline: none; }
  .cbtn-in { transform-box: fill-box; transform-origin: center; transition: transform 0.4s cubic-bezier(0.34, 1.63, 0.64, 1); }
  .cbtn .bg { fill: rgba(255, 255, 255, 0.7); transition: fill 0.2s; }
  .cbtn .ico { fill: var(--ink); transition: fill 0.2s; }
  .cbtn:hover .cbtn-in { transform: scale(1.18); }
  .cbtn:active .cbtn-in { transform: scale(0.86); transition-duration: 0.1s; }
  #btnPlay:hover .bg, #btnPlay:focus-visible .bg { fill: #43D693; }
  #btnReset:hover .bg, #btnReset:focus-visible .bg { fill: #5BB8FF; }
  .cbtn:hover .ico, .cbtn:focus-visible .ico { fill: #FFFFFF; }
  .cbtn:focus-visible .bg { stroke: var(--focus); stroke-width: 2; }

  @media (prefers-reduced-motion: reduce) {
    .interactive .loc:hover .seed-in { animation: none; }
    .loc, .cbtn-in { transition-duration: 0.01s; }
  }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">TOMATOTIMER · 外觀測試版 v0.1</div>
    <h1>Jelly Tomato</h1>
    <p>一顆切開的果凍蕃茄。滑上去會 QQ 彈開，四個果室就是四個時長，中間果核控制開始、暫停、重來。</p>
  </header>

  <div class="grid">
    <section class="stage" aria-label="模擬桌面">
      <div class="menubar">
        <span class="mb-tomato" id="mbTitle">🍅</span>
        <span class="mb-dim">週五 上午 9:41</span>
      </div>
      <div class="tomato-area">
        <svg id="svg" viewBox="-200 -200 400 400" role="group" aria-label="果凍蕃茄計時器"></svg>
      </div>
      <p class="hint" id="hint">把滑鼠移到蕃茄上</p>
    </section>

    <aside class="panel" aria-label="試玩控制">
      <h2>試玩控制</h2>
      <div class="row">
        <label for="speed">快轉模式<small>1 分鐘 = 1 秒，馬上看到時間到</small></label>
        <span class="switch"><input type="checkbox" id="speed" checked><span></span></span>
      </div>
      <div class="row">
        <label for="sound">音效<small>彈開聲、時間到鈴聲</small></label>
        <span class="switch"><input type="checkbox" id="sound" checked><span></span></span>
      </div>
      <div class="btn-row">
        <button class="pbtn" id="jump" type="button">直接時間到</button>
        <button class="pbtn" id="poke" type="button">戳一下</button>
      </div>

      <h2>這版的設計</h2>
      <ul class="notes">
        <li><b>果凍彈簧</b>：放大、縮回都會衝過頭再彈回來；邊緣 48 個點互相牽動，滑鼠劃過邊緣會推出漣漪。</li>
        <li><b>四個果室＝四個時長</b>，順時針 15 → 30 → 45 → 60，滑過各有顏色
          <span class="swatches" aria-hidden="true"><i style="background:#FFC23C"></i><i style="background:#FF7FA8"></i><i style="background:#FF9638"></i><i style="background:#A97BFF"></i></span>，蕃茄籽會跟著扭。</li>
        <li><b>果核</b>：狀態、倒數、開始／暫停（綠）、重來（藍）。</li>
        <li><b>時間到</b>：整顆抖、響鈴，點任何地方進入 10 分鐘休息，變成綠蕃茄。</li>
      </ul>
    </aside>
  </div>
</div>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("svg");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const el = (tag, attrs = {}, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  };
  const polar = (r, a) => [r * Math.cos(a), r * Math.sin(a)];
  const rad = (deg) => (deg * Math.PI) / 180;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const f = (n) => n.toFixed(2);

  // ---------- Build the tomato ----------
  const defs = el("defs", {}, svg);
  const skinGrad = el("radialGradient", { id: "skin", cx: "38%", cy: "30%", r: "75%" }, defs);
  el("stop", { offset: "0%", class: "skin-stop-a" }, skinGrad);
  el("stop", { offset: "100%", class: "skin-stop-b" }, skinGrad);
  const coreGrad = el("radialGradient", { id: "core", cx: "45%", cy: "40%", r: "60%" }, defs);
  el("stop", { offset: "0%", class: "core-stop-a" }, coreGrad);
  el("stop", { offset: "100%", class: "core-stop-b" }, coreGrad);
  const shGrad = el("radialGradient", { id: "shadow" }, defs);
  el("stop", { offset: "0%", "stop-color": "#5A0E08", "stop-opacity": "0.28" }, shGrad);
  el("stop", { offset: "100%", "stop-color": "#5A0E08", "stop-opacity": "0" }, shGrad);

  const shadow = el("ellipse", { fill: "url(#shadow)" }, svg);
  const tomato = el("g", { id: "tomato" }, svg);
  const body = el("path", { fill: "url(#skin)", stroke: "rgba(255,255,255,0.35)", "stroke-width": "2" }, tomato);

  // Four locules = four presets, clockwise from top-left.
  const LOCS = [
    { min: 15, mid: 225, hov: "#FFC23C" },
    { min: 30, mid: 315, hov: "#FF7FA8" },
    { min: 45, mid: 45, hov: "#FF9638" },
    { min: 60, mid: 135, hov: "#A97BFF" },
  ];
  // The cut-open view only shows once the tomato is expanded; collapsed it's a whole tomato.
  const slice = el("g", { id: "slice" }, tomato);
  const locsG = el("g", { id: "locs" }, slice);
  const locEls = LOCS.map((L) => {
    const g = el("g", { class: "loc", tabindex: "0", role: "button", "aria-label": `${L.min} 分鐘`, style: `--hov:${L.hov}` }, locsG);
    g.dataset.min = L.min;
    const a0 = rad(L.mid - 45), a1 = rad(L.mid + 45);
    const rO = 98, rI = 66, gap = 12;
    const [x1, y1] = polar(rO, a0 + gap / rO), [x2, y2] = polar(rO, a1 - gap / rO);
    const [x3, y3] = polar(rI, a1 - gap / rI), [x4, y4] = polar(rI, a0 + gap / rI);
    el("path", { class: "gel", d: `M${f(x1)} ${f(y1)}A${rO} ${rO} 0 0 1 ${f(x2)} ${f(y2)}L${f(x3)} ${f(y3)}A${rI} ${rI} 0 0 0 ${f(x4)} ${f(y4)}Z` }, g);
    // Seeds: an outer arc of four and an inner pair, each pointing outward like a real cross-section.
    const seeds = [[94, -0.5], [94, -0.24], [94, 0.24], [94, 0.5], [70, -0.42], [70, 0.42]];
    seeds.forEach(([r, off], i) => {
      const a = rad(L.mid) + off;
      const [sx, sy] = polar(r, a);
      const outer = el("g", { transform: `translate(${f(sx)} ${f(sy)}) rotate(${f((a * 180) / Math.PI + 90)})` }, g);
      const inner = el("g", { class: "seed-in", style: `animation-delay:${-i * 0.13}s` }, outer);
      el("circle", { r: "7.2" }, inner);
      el("ellipse", { rx: "3.3", ry: "5.4" }, inner);
    });
    const [lx, ly] = polar(80, rad(L.mid));
    const lbl = el("text", { class: "lbl", x: f(lx), y: f(ly + 4), "text-anchor": "middle", "font-size": "24" }, g);
    lbl.textContent = L.min;
    const unit = el("text", { class: "unit", x: f(lx), y: f(ly + 17), "text-anchor": "middle", "font-size": "9" }, g);
    unit.textContent = "分";
    el("circle", { class: "dot", cx: f(lx), cy: f(ly - 24), r: "2.4" }, g);
    return g;
  });
  const lblEls = locEls.map((g) => [...g.querySelectorAll(".lbl,.unit")]).flat();

  // Core (columella) with faint radial streaks.
  el("circle", { r: "54", fill: "url(#core)" }, slice);
  for (let i = 0; i < 8; i++) {
    const [x, y] = polar(48, rad(i * 45 + 22.5));
    el("line", { x1: 0, y1: 0, x2: f(x), y2: f(y), stroke: "var(--ink)", "stroke-opacity": "0.07", "stroke-width": "3", "stroke-linecap": "round" }, slice);
  }

  // Gloss highlight so it reads as jelly.
  el("ellipse", { cx: "-58", cy: "-72", rx: "30", ry: "11", transform: "rotate(-38 -58 -72)", fill: "#FFFFFF", opacity: "0.42", "pointer-events": "none" }, tomato);
  el("ellipse", { cx: "-86", cy: "-30", rx: "6", ry: "4", fill: "#FFFFFF", opacity: "0.35", "pointer-events": "none" }, tomato);

  // Calyx (the green star on top).
  let calyxD = "M-2.5 2 L-2 -12 L2.5 -13 L2.5 2 Z";
  for (let k = 0; k < 5; k++) {
    const a = rad(-90 + 36 + k * 72) ;
    const len = k === 1 || k === 2 || k === 3 ? 19 : 23;
    const [tx, ty] = polar(len, a);
    const [l1x, l1y] = polar(11, a - 0.42), [r1x, r1y] = polar(11, a + 0.42);
    calyxD += `M0 0 Q${f(l1x)} ${f(l1y)} ${f(tx)} ${f(ty * 0.55)} Q${f(r1x)} ${f(r1y)} 0 0Z`;
  }
  const calyx = el("path", { id: "calyx", d: calyxD, "pointer-events": "none" }, tomato);

  // Text: white in the collapsed state, dark on the core when expanded; they cross-fade.
  const lightG = el("g", { "pointer-events": "none" }, tomato);
  const tLight1 = el("text", { class: "t-light", "text-anchor": "middle" }, lightG);
  const tLight2 = el("text", { class: "t-light", "text-anchor": "middle" }, lightG);
  const coreUI = el("g", {}, tomato);
  const tStatus = el("text", { class: "t-status", y: "-27", "text-anchor": "middle", "font-size": "10" }, coreUI);
  const tDark = el("text", { class: "t-dark", "text-anchor": "middle" }, coreUI);
  const tHint = el("text", { class: "t-status", y: "35", "text-anchor": "middle", "font-size": "10" }, coreUI);

  const makeBtn = (id, x, label) => {
    const g = el("g", { id, class: "cbtn", tabindex: "0", role: "button", "aria-label": label, transform: `translate(${x} 31)` }, coreUI);
    // Scale the inner group on hover; scaling the outer one would wipe out its translate.
    const inner = el("g", { class: "cbtn-in" }, g);
    el("circle", { class: "bg", r: "12" }, inner);
    return el("path", { class: "ico" }, inner);
  };
  const icoPlay = makeBtn("btnPlay", -17, "開始或暫停");
  const icoReset = makeBtn("btnReset", 17, "重來");
  const btnPlay = document.getElementById("btnPlay");
  const btnReset = document.getElementById("btnReset");
  const PLAY = "M-3.5 -6 L6.5 0 L-3.5 6 Z";
  const PAUSE = "M-5 -6 h3.6 v12 h-3.6 Z M1.4 -6 h3.6 v12 h-3.6 Z";
  icoReset.setAttribute("d", "M0 -7 A7 7 0 1 1 -6.6 2.3 L-4.2 1.5 A4.6 4.6 0 1 0 0 -4.6 L0 -1.8 L-4.6 -5.8 L0 -9.8 Z");

  // ---------- Jelly physics ----------
  const N = 48;
  const pts = Array.from({ length: N }, (_, i) => ({ a: -Math.PI / 2 + (i * 2 * Math.PI) / N, d: 0, v: 0, acc: 0 }));
  const baseR = (a) => {
    const t = Math.atan2(Math.sin(a + Math.PI / 2), Math.cos(a + Math.PI / 2));
    return 125 - 3.5 * Math.cos(4 * a) - 8 * Math.exp(-(t * t) / 0.05);
  };
  pts.forEach((p) => (p.base = baseR(p.a)));

  const P = { x: 0, v: 0, target: 0 };   // 0 = collapsed, 1 = expanded
  const W = { x: 0, v: 0 };              // squash/stretch wobble
  // Damping 12.9 gives ~14% overshoot (was 20% at 11); AMP 0.7 scales every wobble/ripple kick down 30%.
  const KP = 150, CP = reduce ? 2 * Math.sqrt(150) : 12.9;
  const KW = 230, CW = reduce ? 40 : 9;
  const KR = 260, CR = 9, COUP = 160;
  const AMP = reduce ? 0.25 : 0.7;

  const kickRipple = (strength, lobes = 3) => {
    const phase = Math.random() * Math.PI * 2;
    pts.forEach((p) => (p.v += strength * AMP * Math.sin(lobes * p.a + phase)));
  };

  // ---------- Sound ----------
  let ac = null;
  const soundOn = () => document.getElementById("sound").checked;
  const unlockAudio = () => {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === "suspended") ac.resume();
    } catch (e) { ac = null; }
  };
  const tone = (freq, t0, dur, gain, endFreq) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(freq, t0);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur * 0.6);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(ac.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  };
  const canPlay = () => soundOn() && ac && ac.state === "running";
  const boing = (up) => {
    if (!canPlay()) return;
    const t = ac.currentTime;
    tone(up ? 240 : 430, t, 0.28, 0.07, up ? 520 : 210);
  };
  const chime = (phase) => {
    if (!canPlay()) return;
    const t = ac.currentTime;
    const notes = phase === "work" ? [1318.5, 1046.5, 1318.5, 1046.5] : [784, 988, 1175];
    notes.forEach((fq, i) => { tone(fq, t + i * 0.32, 1.3, 0.16); tone(fq * 2, t + i * 0.32, 0.5, 0.04); });
  };

  // ---------- Timer state machine (mirrors TimerEngine.swift) ----------
  const REST_MIN = 10;
  const speedEl = document.getElementById("speed");
  const spm = () => (speedEl.checked ? 1 : 60);
  const S = { phase: "work", state: "idle", workMin: 30, remaining: 30, endAt: 0 };
  const total = () => (S.phase === "work" ? S.workMin : REST_MIN) * spm();
  S.remaining = total();

  const start = () => { S.endAt = performance.now() + S.remaining * 1000; S.state = "running"; };
  const pause = () => { S.remaining = Math.max(0, (S.endAt - performance.now()) / 1000); S.state = "paused"; };
  const reset = () => { S.remaining = total(); S.state = "idle"; W.v -= 2.5 * AMP; kickRipple(30, 2); };
  const toggle = () => {
    if (S.state === "running") pause();
    else if (S.state === "finished") acknowledge();
    else start();
    W.v += 2 * AMP;
  };
  const selectPreset = (min) => {
    const wasRunning = S.state === "running";
    S.phase = "work"; S.workMin = min; reset();
    if (wasRunning) start();
    kickRipple(45, 4);
  };
  const finish = () => {
    S.remaining = 0; S.state = "finished"; nextJiggle = 0;
    chime(S.phase);
  };
  function acknowledge() {
    if (S.state !== "finished") return;
    if (S.phase === "work") { S.phase = "rest"; S.remaining = total(); start(); }
    else { S.phase = "work"; S.remaining = total(); S.state = "idle"; }
    W.v -= 4 * AMP; kickRipple(70, 5);
  }
  speedEl.addEventListener("change", () => {
    const factor = speedEl.checked ? 1 / 60 : 60;
    if (S.state === "running") { S.remaining = Math.max(0, (S.endAt - performance.now()) / 1000) * factor; start(); }
    else if (S.state === "idle") S.remaining = total();
    else S.remaining *= factor;
  });

  const fmt = (sec) => {
    const s = Math.ceil(sec);
    return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  };
  const STATUS = {
    work: { idle: "準備專注", running: "專注中", paused: "已暫停", finished: "工作完成！" },
    rest: { idle: "休息時間", running: "休息中", paused: "休息暫停", finished: "休息結束" },
  };

  // ---------- Hover / expand ----------
  let hovering = false, leaveTimer = 0, touchExpanded = false;
  const setExpanded = (on) => {
    if ((P.target === 1) === on) return;
    P.target = on ? 1 : 0;
    W.v += (on ? 3.2 : -2.6) * AMP;
    kickRipple(on ? 55 : 35, on ? 3 : 4);
    boing(on);
  };
  tomato.addEventListener("pointerenter", (e) => {
    if (e.pointerType !== "mouse") return;
    hovering = true; clearTimeout(leaveTimer); setExpanded(true);
  });
  tomato.addEventListener("pointerleave", (e) => {
    if (e.pointerType !== "mouse") return;
    hovering = false; clearTimeout(leaveTimer);
    leaveTimer = setTimeout(() => { if (!hovering && !tomato.contains(document.activeElement)) setExpanded(false); }, 220);
  });
  tomato.addEventListener("focusin", () => setExpanded(true));
  tomato.addEventListener("focusout", () => setTimeout(() => {
    if (!hovering && !tomato.contains(document.activeElement)) setExpanded(false);
  }, 0));

  // Poking the edge with the mouse pushes ripples into the surface.
  let lastLocal = null;
  const toLocal = (e) => {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    return { x: p.x / curSX, y: p.y / curSY };
  };
  svg.addEventListener("pointermove", (e) => {
    if (e.pointerType !== "mouse") return;
    const l = toLocal(e);
    if (lastLocal && hovering) {
      const speed = Math.min(30, Math.hypot(l.x - lastLocal.x, l.y - lastLocal.y));
      const r = Math.hypot(l.x, l.y), a = Math.atan2(l.y, l.x);
      if (r > 80) {
        pts.forEach((p) => {
          let diff = Math.abs(Math.atan2(Math.sin(p.a - a), Math.cos(p.a - a)));
          if (diff < 0.6) p.v -= speed * 2.2 * AMP * (1 - diff / 0.6);
        });
      }
    }
    lastLocal = l;
  });

  document.addEventListener("pointerdown", (e) => {
    unlockAudio();
    if (e.pointerType === "mouse") return;
    if (!tomato.contains(e.target)) { setExpanded(false); return; }
    if (P.target === 0 && S.state !== "finished") { touchExpanded = true; setExpanded(true); }
  });
  tomato.addEventListener("pointerdown", () => { W.v -= 2.2 * AMP; });
  tomato.addEventListener("pointerup", () => { W.v += 1.6 * AMP; });

  const activate = (target) => {
    if (S.state === "finished") { acknowledge(); return; }
    if (P.x < 0.6) return;
    const cbtn = target.closest(".cbtn");
    if (cbtn) { cbtn.id === "btnPlay" ? toggle() : reset(); return; }
    const loc = target.closest(".loc");
    if (loc && S.phase === "work") selectPreset(Number(loc.dataset.min));
  };
  tomato.addEventListener("click", (e) => {
    if (touchExpanded) { touchExpanded = false; return; }
    activate(e.target);
  });
  tomato.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(e.target); }
  });

  document.getElementById("jump").addEventListener("click", () => {
    if (S.state !== "finished") finish();
  });
  document.getElementById("poke").addEventListener("click", () => {
    W.v += 4 * AMP; kickRipple(90, 3 + Math.floor(Math.random() * 3));
  });
  if (!matchMedia("(hover: hover)").matches) document.getElementById("hint").textContent = "點一下蕃茄";

  // ---------- Render loop ----------
  let curSX = 0.35, curSY = 0.35, nextJiggle = 0, last = performance.now();
  const mbTitle = document.getElementById("mbTitle");
  let shown = {};
  const setText = (node, key, val) => { if (shown[key] !== val) { node.textContent = val; shown[key] = val; } };
  const setAttr = (node, key, name, val) => { if (shown[key] !== val) { node.setAttribute(name, val); shown[key] = val; } };

  function step(h, now) {
    P.v += (KP * (P.target - P.x) - CP * P.v) * h; P.x += P.v * h;
    W.v += (-KW * W.x - CW * W.v) * h; W.x += W.v * h;
    const t = now / 1000;
    for (let i = 0; i < N; i++) {
      const p = pts[i], prev = pts[(i + N - 1) % N], next = pts[(i + 1) % N];
      const breath = reduce ? 0 : 0.9 * Math.sin(t * 1.8 + p.a * 2);
      p.acc = -KR * (p.d - breath) - CR * p.v + COUP * (prev.d + next.d - 2 * p.d);
    }
    for (const p of pts) { p.v += p.acc * h; p.d = clamp(p.d + p.v * h, -18, 18); }
  }

  function frame(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    for (let s = 0; s < 3; s++) step(dt / 3, now);

    // timer
    if (S.state === "running") {
      S.remaining = (S.endAt - now) / 1000;
      if (S.remaining <= 0) finish();
    }
    if (S.state === "finished" && now > nextJiggle) {
      nextJiggle = now + 1100;
      W.v += (Math.random() > 0.5 ? 5 : -5) * AMP; kickRipple(80, 3 + Math.floor(Math.random() * 3));
    }

    // geometry
    const p = P.x, R = 44 + 96 * p, s = R / 125, w = clamp(W.x, -0.32, 0.32);
    curSX = s * (1 + w); curSY = s * (1 - w * 0.9);
    tomato.setAttribute("transform", `scale(${f(curSX)} ${f(curSY)})`);

    const xy = pts.map((q) => { const r = q.base + q.d; return [r * Math.cos(q.a) * 1.035, r * Math.sin(q.a)]; });
    let d = `M${f(xy[0][0])} ${f(xy[0][1])}`;
    for (let i = 0; i < N; i++) {
      const p0 = xy[(i + N - 1) % N], p1 = xy[i], p2 = xy[(i + 1) % N], p3 = xy[(i + 2) % N];
      d += `C${f(p1[0] + (p2[0] - p0[0]) / 6)} ${f(p1[1] + (p2[1] - p0[1]) / 6)} ${f(p2[0] - (p3[0] - p1[0]) / 6)} ${f(p2[1] - (p3[1] - p1[1]) / 6)} ${f(p2[0])} ${f(p2[1])}`;
    }
    body.setAttribute("d", d + "Z");
    calyx.setAttribute("transform", `translate(0 ${f(xy[0][1] + 4)}) scale(${f(1 + w * 0.6)} ${f(1 - w * 0.6)})`);
    shadow.setAttribute("cx", 0);
    shadow.setAttribute("cy", f(curSY * 125 + 8));
    shadow.setAttribute("rx", f(curSX * 125 * 0.85));
    shadow.setAttribute("ry", f(10 + 6 * p));

    // detail fades in as it grows
    const e = clamp((p - 0.35) / 0.5, 0, 1);
    slice.style.opacity = f(e);
    coreUI.style.opacity = f(e);
    lightG.style.opacity = f(1 - e);
    lblEls.forEach((n) => (n.style.opacity = S.phase === "work" ? "1" : "0"));
    const live = e > 0.6;
    coreUI.style.pointerEvents = live && S.state !== "finished" ? "auto" : "none";
    tomato.classList.toggle("interactive", live && S.phase === "work" && S.state !== "finished");
    svg.classList.toggle("rest", S.phase === "rest");
    tomato.classList.toggle("done", S.state === "finished");
    locEls.forEach((g) => {
      const sel = Number(g.dataset.min) === S.workMin && S.phase === "work";
      g.classList.toggle("sel", sel);
      g.querySelector(".dot").style.opacity = sel ? "0.8" : "0";
    });

    // text
    const done = S.state === "finished";
    const time = fmt(Math.max(0, S.remaining));
    setText(tStatus, "status", STATUS[S.phase][S.state]);
    if (done) {
      setText(tLight1, "l1", S.phase === "work" ? "時間到" : "休息完");
      setAttr(tLight1, "l1s", "font-size", "44"); setAttr(tLight1, "l1y", "y", "6");
      setText(tLight2, "l2", S.phase === "work" ? "點我休息" : "點我繼續");
      setAttr(tLight2, "l2s", "font-size", "24"); setAttr(tLight2, "l2y", "y", "42");
      setText(tDark, "d", S.phase === "work" ? "時間到！" : "休息完！");
      setAttr(tDark, "ds", "font-size", "22"); setAttr(tDark, "dy", "y", "8");
      setText(tHint, "h", S.phase === "work" ? "點一下開始休息" : "點一下回到工作");
    } else {
      setText(tLight1, "l1", time);
      setAttr(tLight1, "l1s", "font-size", "60"); setAttr(tLight1, "l1y", "y", "21");
      setText(tLight2, "l2", "");
      setText(tDark, "d", time);
      setAttr(tDark, "ds", "font-size", "30"); setAttr(tDark, "dy", "y", "10");
      setText(tHint, "h", "");
    }
    btnPlay.style.display = btnReset.style.display = done ? "none" : "";
    setAttr(icoPlay, "play", "d", S.state === "running" ? PAUSE : PLAY);
    tLight1.style.opacity = S.state === "running" || done ? "1" : "0.8";

    // menu bar
    const icon = S.phase === "work" ? "🍅" : "🌿";
    let title = `${icon} ${time}`;
    if (done) title = `${icon} ⏰`;
    else if (S.state === "idle" && S.phase === "work") title = icon;
    else if (S.state === "paused") title = `${icon} ⏸ ${time}`;
    setText(mbTitle, "mb", title);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // A short demo bounce on load so the first view shows the jelly.
  setTimeout(() => { if (!hovering) setExpanded(true); }, 500);
  setTimeout(() => { if (!hovering && !tomato.contains(document.activeElement)) setExpanded(false); }, 2300);
})();
</script>
